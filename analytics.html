    <script>
        // Play login music on page load

            var audio = document.getElementById('login-music');
            if (audio) {
                audio.play().catch(() => { });
            }
        });
    </script>
    <script>
        // Seamless music playback logic for analytics page (no music, but logic is present for consistency)
        document.addEventListener('DOMContentLoaded', function () {
            let musicStarted = sessionStorage.getItem('musicStarted') === 'true';
            const startMusic = () => {
                if (!musicStarted) {
                    musicStarted = true;
                    sessionStorage.setItem('musicStarted', 'true');
                    document.removeEventListener('click', startMusic);
                }
            };
            if (!musicStarted) {
                document.addEventListener('click', startMusic);
            }
        });
    </script>
    <script>
        async function loadAnalytics() {
            try {
                const response = await fetch('php/analytics.php?type=player_behavior');
                const data = await response.json();

                if (data.success) {
                    displayAnalytics(data);
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        }
